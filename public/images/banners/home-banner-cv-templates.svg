<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1654 419" width="1654" height="419" role="img" aria-label="CV templates banner">
  <defs>
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#cfd5e0"/>
    </pattern>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1654" height="419" fill="#f6f8fb"/>
  <g opacity="0.55">
    <path d="M40,40 Q120,20 200,60 T380,90 T540,70 Q600,40 660,80" stroke="#cfd5e0" stroke-width="0.6" fill="none"/>
    <path d="M120,320 Q220,360 320,330 T520,360 T700,330" stroke="#cfd5e0" stroke-width="0.6" fill="none"/>
  </g>
  <rect x="40" y="50" width="560" height="319" fill="url(#dots)" opacity="0.45"/>

  <!-- Left: quote area -->
  <g transform="translate(70,90)">
    <path d="M0,30 L30,0 L30,30 L0,60 Z" fill="#3b82f6" opacity="0.95"/>
    <path d="M0,30 L30,0 L30,30 L0,60 Z" fill="none" stroke="#1d4ed8" stroke-width="1"/>
    <text x="60" y="40" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#f59e0b">CV chuẩn ATS</text>
    <text x="60" y="86" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#1d4ed8">trong 30 phút với</text>
    <text x="60" y="118" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#f59e0b">Nexthire Templates</text>
    <text x="60" y="160" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">12+ mẫu chuyên nghiệp · tối ưu cho nhà tuyển dụng</text>
    <text x="60" y="200" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569" opacity="0">.</text>
    <!-- Decorative ticks -->
