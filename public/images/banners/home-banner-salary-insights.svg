<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1654 419" width="1654" height="419" role="img" aria-label="Salary insights banner">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1654" height="419" fill="url(#bg-grad)"/>

  <!-- Decorative grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="80" x2="1654" y2="80"/>
    <line x1="0" y1="160" x2="1654" y2="160"/>
    <line x1="0" y1="240" x2="1654" y2="240"/>
    <line x1="0" y1="320" x2="1654" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="419"/>
    <line x1="400" y1="0" x2="400" y2="419"/>
    <line x1="600" y1="0" x2="600" y2="419"/>
    <line x1="800" y1="0" x2="800" y2="419"/>
    <line x1="1000" y1="0" x2="1000" y2="419"/>
    <line x1="1200" y1="0" x2="1200" y2="419"/>
    <line x1="1400" y1="0" x2="1400" y2="419"/>
  </g>

  <!-- Left: stat block -->
  <g transform="translate(70,80)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="0" y="0" width="60" height="4" rx="2" fill="#22d3ee"/>
      <text x="0" y="36" font-size="14" font-weight="700" letter-spacing="2" fill="#22d3ee">SALARY INSIGHTS 2026</text>
    </g>
    <text x="0" y="86" font-size="34" font-weight="800" fill="#ffffff">Biết lương</text>
    <text x="0" y="126" font-size="34" font-weight="800" fill="#22d3ee">trước khi deal.</text>
    <text x="0" y="170" font-size="14" fill="#94a3b8">So sánh mức lương theo role · level · thành phố.</text>
    <text x="0" y="192" font-size="14" fill="#94a3b8">Cập nhật mỗi tuần từ 50.000+ offer thực.</text>

    <!-- Stat tiles -->
    <g transform="translate(0,220)">
      <rect width="140" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="32" font-size="24" font-weight="800" fill="#ffffff">50K+</text>
      <text x="14" y="56" font-size="11" fill="#94a3b8">offers analyzed</text>
      <text x="14" y="72" font-size="10" font-weight="700" fill="#22d3ee">↗ +12% vs 2025</text>

      <rect x="156" width="140" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="170" y="32" font-size="24" font-weight="800" fill="#ffffff">12</text>
      <text x="170" y="56" font-size="11" fill="#94a3b8">industry tracks</text>
      <text x="170" y="72" font-size="10" font-weight="700" fill="#22d3ee">+ 3 new in 2026</text>

      <rect x="312" width="140" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="326" y="32" font-size="24" font-weight="800" fill="#ffffff">3 cty</text>
      <text x="326" y="56" font-size="11" fill="#94a3b8">Hanoi · HCMC · Da Nang</text>
      <text x="326" y="72" font-size="10" font-weight="700" fill="#22d3ee">+ Remote tier</text>
    </g>
  </g>

  <!-- Right: 4 salary insight cards in 2x2 grid -->
  <g transform="translate(660,40)" font-family="Inter, Arial, sans-serif">
    <g filter="url(#card-shadow)">
      <rect width="475" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="34" font-size="12" font-weight="700" letter-spacing="1.5" fill="#22d3ee">SOFTWARE ENGINEER</text>
      <text x="20" y="74" font-size="28" font-weight="800" fill="#ffffff">25M – 65M</text>
      <text x="20" y="98" font-size="13" fill="#94a3b8">VND/tháng · Mid → Staff · Hanoi</text>
      <!-- Mini bar chart -->
      <g transform="translate(280,40)">
        <rect x="0" y="40" width="14" height="60" rx="3" fill="#475569"/>
        <rect x="22" y="20" width="14" height="80" rx="3" fill="#22d3ee"/>
        <rect x="44" y="50" width="14" height="50" rx="3" fill="#475569"/>
        <rect x="66" y="10" width="14" height="90" rx="3" fill="#22d3ee"/>
        <rect x="88" y="35" width="14" height="65" rx="3" fill="#475569"/>
        <rect x="110" y="0" width="14" height="100" rx="3" fill="#22d3ee"/>
        <rect x="132" y="25" width="14" height="75" rx="3" fill="#475569"/>
      </g>
      <g transform="translate(20,116)">
        <text font-size="11" fill="#94a3b8">Min · Median · Max · 90th pct</text>
      </g>
    </g>

    <g transform="translate(0,180)" filter="url(#card-shadow)">
      <rect width="475" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="34" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f59e0b">PRODUCT MANAGER</text>
      <text x="20" y="74" font-size="28" font-weight="800" fill="#ffffff">30M – 80M</text>
      <text x="20" y="98" font-size="13" fill="#94a3b8">VND/tháng · Senior · HCMC</text>
      <!-- Trend sparkline -->
      <g transform="translate(280,30)">
        <polyline points="0,80 25,72 50,68 75,60 100,55 125,42 150,38" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="150" cy="38" r="4" fill="#f59e0b"/>
        <text x="160" y="42" font-size="11" font-weight="700" fill="#f59e0b">+18% YoY</text>
      </g>
      <g transform="translate(20,116)">
        <text font-size="11" fill="#94a3b8">Hot role · Equity package common</text>
      </g>
    </g>

    <g transform="translate(495,0)" filter="url(#card-shadow)">
      <rect width="475" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="34" font-size="12" font-weight="700" letter-spacing="1.5" fill="#ec4899">DATA SCIENTIST</text>
      <text x="20" y="74" font-size="28" font-weight="800" fill="#ffffff">35M – 90M</text>
      <text x="20" y="98" font-size="13" fill="#94a3b8">VND/tháng · Senior · Remote OK</text>
      <!-- Donut -->
      <g transform="translate(280,20)">
        <circle cx="40" cy="40" r="30" fill="none" stroke="#334155" stroke-width="8"/>
        <circle cx="40" cy="40" r="30" fill="none" stroke="#ec4899" stroke-width="8"
                stroke-dasharray="125 188" transform="rotate(-90 40 40)"/>
        <text x="40" y="46" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">68%</text>
        <text x="80" y="34" font-size="11" fill="#94a3b8">ML/AI roles</text>
        <text x="80" y="50" font-size="11" fill="#94a3b8">grew YoY</text>
      </g>
      <g transform="translate(20,116)">
        <text font-size="11" fill="#94a3b8">Python · SQL · MLOps stack</text>
      </g>
    </g>

    <g transform="translate(495,180)" filter="url(#card-shadow)">
      <rect width="475" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="34" font-size="12" font-weight="700" letter-spacing="1.5" fill="#10b981">UX DESIGNER</text>
      <text x="20" y="74" font-size="28" font-weight="800" fill="#ffffff">20M – 55M</text>
      <text x="20" y="98" font-size="13" fill="#94a3b8">VND/tháng · Senior · Hybrid</text>
      <!-- Range -->
      <g transform="translate(280,40)">
        <rect x="0" y="20" width="160" height="6" rx="3" fill="#334155"/>
        <rect x="0" y="20" width="100" height="6" rx="3" fill="#10b981"/>
        <circle cx="0" cy="23" r="6" fill="#10b981"/>
        <circle cx="100" cy="23" r="6" fill="#10b981" stroke="#fff" stroke-width="2"/>
        <circle cx="160" cy="23" r="6" fill="#334155"/>
        <text x="0" y="56" font-size="10" fill="#94a3b8">Junior</text>
        <text x="74" y="56" font-size="10" fill="#10b981">Median</text>
        <text x="138" y="56" font-size="10" fill="#94a3b8">Staff</text>
      </g>
      <g transform="translate(20,116)">
        <text font-size="11" fill="#94a3b8">Figma · Design system · Research</text>
      </g>
    </g>
  </g>
</svg>