<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1654 419" width="1654" height="419" role="img" aria-label="Job alerts banner">
  <defs>
    <linearGradient id="bg-grad-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="card-shadow-2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#082f49" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1654" height="419" fill="url(#bg-grad-2)"/>

  <!-- Decorative pulse circles -->
  <g opacity="0.18" stroke="#67e8f9" stroke-width="1" fill="none">
    <circle cx="1380" cy="100" r="40"/>
    <circle cx="1380" cy="100" r="60"/>
    <circle cx="1380" cy="100" r="80"/>
    <circle cx="280" cy="340" r="40"/>
    <circle cx="280" cy="340" r="60"/>
  </g>

  <!-- Left: hero text + search mock -->
  <g transform="translate(70,70)" font-family="Inter, Arial, sans-serif">
    <!-- Bell icon with pulse -->
    <g transform="translate(0,0)">
      <circle cx="24" cy="24" r="22" fill="#22d3ee"/>
      <path d="M24,12 C18,12 14,16 14,22 L14,28 L11,32 L37,32 L34,28 L34,22 C34,16 30,12 24,12 Z M21,34 C21,36 22,38 24,38 C26,38 27,36 27,34 Z" fill="#0c4a6e"/>
      <circle cx="38" cy="14" r="6" fill="#f43f5e"/>
      <text x="38" y="18" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">3</text>
    </g>
    <text x="0" y="100" font-size="36" font-weight="800" fill="#ffffff">Job alert mỗi sáng thứ Hai.</text>
    <text x="0" y="138" font-size="14" fill="#cffafe">Đăng ký 1 lần · nhận đúng role · không spam.</text>

    <!-- Mock search input -->
    <g transform="translate(0,170)">
      <rect width="500" height="64" rx="10" fill="#ffffff" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="28" cy="32" r="8" fill="none" stroke="#0891b2" stroke-width="2"/>
      <line x1="35" y1="38" x2="42" y2="46" stroke="#0891b2" stroke-width="2"/>
      <text x="60" y="38" font-size="14" fill="#94a3b8">React · Senior · Remote · 25M+</text>
      <rect x="380" y="14" width="100" height="36" rx="8" fill="#0c4a6e"/>
      <text x="430" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Subscribe</text>
    </g>

    <!-- Frequency chips -->
    <g transform="translate(0,250)" font-size="12" font-weight="600">
      <rect x="0" y="0" width="60" height="28" rx="14" fill="#0891b2"/>
      <text x="30" y="18" text-anchor="middle" fill="#fff">Daily</text>
      <rect x="68" y="0" width="80" height="28" rx="14" fill="#fff"/>
      <text x="108" y="18" text-anchor="middle" fill="#0c4a6e">Weekly ✓</text>
      <rect x="156" y="0" width="80" height="28" rx="14" fill="#fff" opacity="0.4"/>
      <text x="196" y="18" text-anchor="middle" fill="#fff">Real-time</text>
    </g>
  </g>

  <!-- Right: 3 sample alert cards stacked -->
  <g transform="translate(700,40)" font-family="Inter, Arial, sans-serif">
    <g filter="url(#card-shadow-2)">
      <rect width="580" height="100" rx="10" fill="#ffffff"/>
      <circle cx="32" cy="50" r="16" fill="#3b82f6"/>
      <text x="32" y="55" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">NT</text>
      <text x="64" y="38" font-size="14" font-weight="700" fill="#0f172a">Senior React Engineer</text>
      <text x="64" y="58" font-size="12" fill="#64748b">NexHire Tech · Remote · 35M – 60M</text>
      <g transform="translate(64,72)">
        <rect width="50" height="16" rx="8" fill="#dbeafe"/>
        <text x="25" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">NEW</text>
        <rect x="58" width="60" height="16" rx="8" fill="#d1fae5"/>
        <text x="88" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">VERIFIED</text>
        <rect x="126" width="48" height="16" rx="8" fill="#fef3c7"/>
        <text x="150" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">HOT</text>
      </g>
      <text x="555" y="38" text-anchor="end" font-size="10" fill="#94a3b8">2 giờ trước</text>
      <text x="555" y="58" text-anchor="end" font-size="10" font-weight="700" fill="#0c4a6e">Xem →</text>
    </g>

    <g transform="translate(0,116)" filter="url(#card-shadow-2)">
      <rect width="580" height="100" rx="10" fill="#ffffff"/>
      <circle cx="32" cy="50" r="16" fill="#10b981"/>
      <text x="32" y="55" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CF</text>
      <text x="64" y="38" font-size="14" font-weight="700" fill="#0f172a">Product Manager</text>
      <text x="64" y="58" font-size="12" fill="#64748b">Cloudify VN · HCMC · 40M – 75M</text>
      <g transform="translate(64,72)">
        <rect width="50" height="16" rx="8" fill="#dbeafe"/>
        <text x="25" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">NEW</text>
        <rect x="58" width="60" height="16" rx="8" fill="#d1fae5"/>
        <text x="88" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">VERIFIED</text>
        <rect x="126" width="74" height="16" rx="8" fill="#fce7f3"/>
        <text x="162" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#be185d">EQUITY</text>
      </g>
      <text x="555" y="38" text-anchor="end" font-size="10" fill="#94a3b8">5 giờ trước</text>
      <text x="555" y="58" text-anchor="end" font-size="10" font-weight="700" fill="#0c4a6e">Xem →</text>
    </g>

    <g transform="translate(0,232)" filter="url(#card-shadow-2)">
      <rect width="580" height="100" rx="10" fill="#ffffff"/>
      <circle cx="32" cy="50" r="16" fill="#f59e0b"/>
      <text x="32" y="55" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">AF</text>
      <text x="64" y="38" font-size="14" font-weight="700" fill="#0f172a">Data Scientist</text>
      <text x="64" y="58" font-size="12" fill="#64748b">ApexForge · Da Nang · 50M – 90M</text>
      <g transform="translate(64,72)">
        <rect width="50" height="16" rx="8" fill="#dbeafe"/>
        <text x="25" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">NEW</text>
        <rect x="58" width="80" height="16" rx="8" fill="#ede9fe"/>
        <text x="98" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">ML / AI</text>
        <rect x="146" width="56" height="16" rx="8" fill="#fef3c7"/>
        <text x="174" y="12" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">URGENT</text>
      </g>
      <text x="555" y="38" text-anchor="end" font-size="10" fill="#94a3b8">hôm qua</text>
      <text x="555" y="58" text-anchor="end" font-size="10" font-weight="700" fill="#0c4a6e">Xem →</text>
    </g>
  </g>
</svg>